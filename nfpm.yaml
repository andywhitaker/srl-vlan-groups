name: vlan-groups
version: 0.1.0
arch: amd64
platform: linux
maintainer: Andy Whitaker <32944047+andywhitaker@users.noreply.github.com>
description: Nokia SR Linux NDK agent for centralized VLAN group management
vendor: Nokia SR Linux Community
license: Apache-2.0
contents:
  - src: ./app_src/src/vlan_groups_app.py
    dst: /opt/vlan-groups/src/vlan_groups_app.py
    file_info:
      mode: 0755
  - src: ./app_src/src/vendor
    dst: /opt/vlan-groups/src/vendor
  - src: ./build_scripts/start.sh
    dst: /opt/vlan-groups/build_scripts/vlan-groups
    file_info:
      mode: 0755
  - src: ./app_src/yang/srl_nokia-vlan-groups.yang
    dst: /opt/vlan-groups/yang/srl_nokia-vlan-groups.yang
    file_info:
      mode: 0644
  - src: ./app_src/vlan-groups.yml
    dst: /etc/opt/srlinux/appmgr/vlan-groups.yml
    file_info:
      mode: 0644
  - src: ./app_src/cli-plugins/vlan_groups_show.py
    # Place the CLI plugin here and symlink it in postinstall
    dst: /opt/vlan-groups/cli-plugins/vlan_groups_show.py
    file_info:
      mode: 0644
scripts:
  postinstall: ./build_scripts/postinstall.sh
  preremove: ./build_scripts/preremove.sh
  postremove: ./build_scripts/postremove.sh
